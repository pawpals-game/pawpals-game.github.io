<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawPals — Welcome Home</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff9f0;
            color: #4a3e3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(210, 180, 140, 0.2);
            border: 2px solid #f3e1cb;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #d87a68;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #7d6b69;
        }
        .login-btn {
            background-color: #68b0ab;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .login-btn:hover {
            background-color: #539490;
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 PawPals</h1>
        <p>A cozy space for friends & critters.</p>
        <!-- Triggers your secure live backend routing pathway -->
        <a href="https://pawpals-backend.onrender.com" class="login-btn">
            Sign in with Google
        </a>
    </div>
</body>
</html>
